[metadata]
name = MSquantSim
version = 0.0.1
description = MSquantSim: utilities for MS proteomics simulation and analysis
long_description = file: README.md
long_description_content_type = text/markdown
author = devonjkohler
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
packages = find:
package_dir =
    = src
include_package_data = True
python_requires = >=3.11
install_requires =
    copulas>=0.12.3
    indra>=1.24.0
    matplotlib>=3.9.2
    networkx>=3.0
    numpy>=1.26.4,<2
    pandas>=2.2.2
    protmapper>=0.0.29
    scikit-learn>=1.5.1
    scipy>=1.12.0
    sdv>=1.30.0
    seaborn>=0.13.2
    table_evaluator>=1.9.0
    tqdm>=4.66.5
    tqdm_joblib>=0.0.5

[options.packages.find]
where = src
